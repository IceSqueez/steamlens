[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.2"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["IceSqueez <IceSqueez@gmail.com>"]
repository = "https://github.com/IceSqueez/steamlens"

[workspace.dependencies]
iced = { version = "0.14", features = ["tokio", "image", "svg", "lazy"] }
tokio = { version = "1.52", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "fs",
  "process",
] }
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "http2",
] }
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
] }
libloading = { version = "0.9" }
thiserror = { version = "2.0" }
static_assertions = { version = "1.1" }
serde = { version = "1.0", features = ["derive"] }
toml = { version = "1.1" }
serde_json = { version = "1.0" }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
memmap2 = { version = "0.9" }
tempfile = { version = "3" }
winreg = { version = "0.56" }
windows-sys = { version = "0.61", features = [
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Kernel",
  "Win32_System_Console",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_ProcessStatus",
] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }
semver = { version = "1.0" }
steamlens-core = { path = "crates/steamlens-core" }
steamlens-vdf = { path = "crates/steamlens-vdf" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
