[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0-alpha.2+build.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["IceSqueez <IceSqueez@gmail.com>"]
repository = "https://github.com/IceSqueez/steamlens"

[workspace.dependencies]
iced = { version = "0.14", features = ["tokio", "image"] }
tokio = { version = "1.52", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "fs",
  "process",
] }
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "http2",
] }
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
] }
libloading = { version = "0.9" }
thiserror = { version = "2.0" }
static_assertions = { version = "1.1" }
serde = { version = "1.0", features = ["derive"] }
toml = { version = "1.1" }
serde_json = { version = "1.0" }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
steamlens-core = { path = "crates/steamlens-core" }
steamlens-vdf = { path = "crates/steamlens-vdf" }
