[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0-alpha.1+build.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["IceSqueez <IceSqueez@gmail.com>"]
repository = "https://github.com/IceSqueez/steamlens"

[workspace.dependencies]
iced = { version = "0.14.0", features = ["tokio", "image"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
libloading = "0.9"
thiserror = "2"
static_assertions = "1"
steamlens-core = { path = "crates/steamlens-core" }
steamlens-vdf = { path = "crates/steamlens-vdf" }
