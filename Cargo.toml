[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0-alpha.0+build.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["IceSqueez <IceSqueez@gmail.com>"]
repository = "https://github.com/IceSqueez/steamlens"

[workspace.dependencies]
iced = { version = "0.14.0", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
