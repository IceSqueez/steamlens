name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # No `test` job here: tags are cut from `main`, where CI has already
  # validated `cargo test --workspace --locked`. Re-running the test suite
  # would burn ~5 min/release for zero added signal.
  build:
    name: Build
    uses: ./.github/workflows/_build-matrix.yml
    with:
      bin_name: steamlens-app
      retention_days: 1

  publish:
    name: Publish
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: artifacts
        run: |
          for f in *; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done

      - name: Resolve previous tag
        id: prev_tag
        run: |
          PREV=$(git tag -l "v*" --sort=-version:refname | sed -n '2p')
          if [ -n "$PREV" ]; then
            echo "range=$PREV.." >> $GITHUB_OUTPUT
          else
            echo "range=" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Fallback changelog
        if: hashFiles('RELEASE_NOTES.md') == '' || steps.cliff.outcome == 'failure'
        run: |
          {
            echo "## What's Changed"
            echo ""
            git log ${{ steps.prev_tag.outputs.range }}HEAD --oneline --no-merges \
              | grep -v "^.*chore: Release" \
              | grep -v "^.*docs(changelog)" \
              | sed 's/^[a-f0-9]* /- /'
          } > RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: artifacts/*
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
