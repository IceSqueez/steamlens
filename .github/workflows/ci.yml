name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '**/build.rs'
      - '.github/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --all -- --check

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-stable

      - name: Install system dependencies (iced runtime)
        run: sudo apt-get update -qq && sudo apt-get install -y libwayland-dev libxkbcommon-dev libgl1-mesa-dev libx11-dev pkg-config

      - name: Clippy
        run: cargo clippy --workspace --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  cross-compile:
    name: Cross-compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [check]
    # Skip on push-to-main: PR already validated this. macOS/Windows are
    # 2-10× cost multipliers; main-push runs would burn the monthly budget
    # without adding signal. Direct main pushes (no PR) trade safety for cost
    # — broken cross-platform code surfaces on the next PR or release tag.
    if: github.event_name == 'pull_request'
    strategy:
      # fail-fast cancels remaining matrix jobs on first failure. We trade
      # multi-platform failure visibility for cost: if Windows breaks, we
      # don't burn ~50 min on macOS to also confirm it's broken.
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          # macos-26-intel intentionally omitted from CI: validated only on
          # release tag via _build-matrix.yml. Intel-specific issues are rare
          # since Apple Silicon arm64 covers the same SysV-x64 ABI semantics.
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-stable

      - name: Check
        run: cargo check --workspace --locked --target ${{ matrix.target }}
