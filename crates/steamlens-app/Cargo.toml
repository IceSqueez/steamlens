[package]
name = "steamlens-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Desktop tool for inspecting and modifying Steam achievements and stats"
readme = "../../README.md"

[dependencies]
iced = { workspace = true }
tokio = { workspace = true, features = [
  "io-util",
  "io-std",
  "rt",
  "sync",
  "process",
] }
reqwest = { workspace = true }
image = { workspace = true }
steamlens-core = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
semver = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[[bin]]
name = "steamlens-app"
path = "src/main.rs"

[package.metadata.wix]
eula = false

[package.metadata.deb]
name = "steamlens"
maintainer = "IceSqueez <icesqueez@gmail.com>"
copyright = "2026, IceSqueez"
license-file = ["../../LICENSE-MIT", "0"]
extended-description = "Desktop tool for inspecting and modifying Steam achievements and stats by attaching to a running Steam client."
section = "games"
priority = "optional"
depends = "libc6, libwayland-client0, libxkbcommon0, libgl1"
assets = [
  ["target/release/steamlens-app", "usr/bin/steamlens-app", "755"],
  ["../../assets/steamlens.desktop", "usr/share/applications/steamlens.desktop", "644"],
  ["../../assets/icon-16.png",  "usr/share/icons/hicolor/16x16/apps/steamlens.png",   "644"],
  ["../../assets/icon-32.png",  "usr/share/icons/hicolor/32x32/apps/steamlens.png",   "644"],
  ["../../assets/icon-48.png",  "usr/share/icons/hicolor/48x48/apps/steamlens.png",   "644"],
  ["../../assets/icon-64.png",  "usr/share/icons/hicolor/64x64/apps/steamlens.png",   "644"],
  ["../../assets/icon-128.png", "usr/share/icons/hicolor/128x128/apps/steamlens.png", "644"],
  ["../../assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/steamlens.png", "644"],
  ["../../assets/icon-512.png", "usr/share/icons/hicolor/512x512/apps/steamlens.png", "644"],
]

[package.metadata.generate-rpm]
name = "steamlens"
license = "MIT OR Apache-2.0"
summary = "Steam achievement and stats inspector"
requires = { "libwayland-client" = "*", "libxkbcommon" = "*", "mesa-libGL" = "*" }
assets = [
  { source = "target/release/steamlens-app", dest = "/usr/bin/steamlens-app", mode = "755" },
  { source = "../../assets/steamlens.desktop", dest = "/usr/share/applications/steamlens.desktop", mode = "644" },
  { source = "../../assets/icon-16.png",  dest = "/usr/share/icons/hicolor/16x16/apps/steamlens.png",   mode = "644" },
  { source = "../../assets/icon-32.png",  dest = "/usr/share/icons/hicolor/32x32/apps/steamlens.png",   mode = "644" },
  { source = "../../assets/icon-48.png",  dest = "/usr/share/icons/hicolor/48x48/apps/steamlens.png",   mode = "644" },
  { source = "../../assets/icon-64.png",  dest = "/usr/share/icons/hicolor/64x64/apps/steamlens.png",   mode = "644" },
  { source = "../../assets/icon-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/steamlens.png", mode = "644" },
  { source = "../../assets/icon-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/steamlens.png", mode = "644" },
  { source = "../../assets/icon-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/steamlens.png", mode = "644" },
]
